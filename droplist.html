<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; media-src 'self' blob:; connect-src 'self' https://timeapi.io https://api.ipify.org https://identitytoolkit.googleapis.com https://firestore.googleapis.com; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self';">
  <title>Drop List - Lineage</title>

  <!-- Maintenance Mode Check -->
  <script src="maintenance.js"></script>

  <!-- Favicon -->
  <link id="favicon-ico" rel="icon" type="image/x-icon" href="icon/cs.ico" />
  <link id="favicon-shortcut" rel="shortcut icon" href="icon/cs.ico" />

  <!-- Google Font: Cinzel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="no-hscroll bg-gradient-to-br from-gray-900 to-black min-h-screen text-gray-200 text-base md:text-lg px-0 md:px-8">

    <!-- ========================================================================
    BACKGROUND VIDEO
    ======================================================================== -->
    <div id="bg-video-container">
        <video src="media/droplist.mp4" autoplay muted loop playsinline preload="metadata"></video>
    </div>

    <div id="page-content" class="max-w-7xl mx-auto">

        <header class="flex justify-between items-center pt-8 pb-4">
            <div class="flex-1">
                <a href="index.html" class="action-btn btn-gray inline-flex items-center gap-2 return-main-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                    Return to Main
                </a>
            </div>
            <div class="flex-1 text-center">
                <h1 class="text-3xl font-bold text-yellow-400 text-shadow">Drop List</h1>
            </div>
            <div class="flex-1"></div>
        </header>

        <main class="ui-panel p-6">
            <div id="loading-spinner" class="loading-spinner" style="display: none;"></div>
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <div class="relative w-full md:w-1/3">
                    <input type="text" id="droplist-search" placeholder="Search for an item or monster..." class="w-full bg-gray-900/50 border border-gray-600 rounded-md p-2 pl-10 text-white focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" /></svg>
                </div>
                <div id="sort-controls" class="flex justify-end space-x-4"></div>

<button id="print-table-btn" class="action-btn btn-purple">Print Table</button>
<button id="clear-search-btn" class="action-btn btn-red">Clear Search</button>
            </div>
            <div class="overflow-x-auto">
                <table id="droplistTable" class="data-table">
                    <thead>
                        <tr class="text-left text-xs font-medium text-yellow-400 uppercase tracking-wider">
                            <th class="px-6 py-3">Mob</th>
                            <th class="px-6 py-3">Item</th>
                            <th class="px-6 py-3">Min</th>
                            <th class="px-6 py-3">Max</th>
                            <th class="px-6 py-3">Rate</th>
                            <th class="px-6 py-3">Level</th>
                            <th class="px-6 py-3">Enchant</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be rendered here by droplist.js -->
                    </tbody>
                </table>
            </div>
            <div id="pagination-controls" class="flex justify-center items-center gap-4 py-4">
                <div class="flex items-center gap-2">
                    <label for="items-per-page" class="text-sm font-medium text-gray-300">Items per page:</label>
                    <select id="items-per-page" class="bg-gray-900/50 border border-gray-600 rounded-md p-2 text-white focus:outline-none focus:ring-2 focus:ring-yellow-500">
                        <option value="100">100</option>
                        <option value="200">200</option>
                        <option value="300" selected>300</option>
                        <option value="500">500</option>
                        <option value="1000">1000</option>
                    </select>
                </div>
            </div>
        </main>
    </div>

  <!-- DEDICATED NOTIFICATION MODAL (for specific messages) -->
  <div id="notification-modal" class="fixed inset-0 modal-overlay-pattern flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
      <div id="notification-modal-content" class="ui-panel p-8 text-center max-w-sm w-full transform scale-95 transition-transform duration-300">
          <h2 id="notification-modal-title" class="text-2xl font-bold text-yellow-400 mb-4">Notice</h2>
          <p id="notification-modal-message" class="text-gray-300 mb-6">This is a notification.</p>
          <div class="flex justify-center gap-4">
              <button id="notification-modal-ok-btn" class="action-btn btn-blue">OK</button>
          </div>
      </div>
  </div>

  <!-- ========================================================================
  SCRIPT INCLUDES
  ======================================================================== -->
  <script src="script.js"></script> <!-- Needed for loadServerProperties -->
  <script src="modal.js"></script>
  <script src="droplist.js"></script>

  <button id="scroll-to-top-btn" class="action-btn btn-blue fixed bottom-4 right-4" style="display: none;">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
    </svg>
  </button>

</body>
</html>
